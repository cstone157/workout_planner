{{- if .Values.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-service
  namespace: workout-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-service
  template:
    metadata:
      labels:
        app: mcp-service
    spec:
      containers:
        - name: mcp-service
          image: project/mcp-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: CHROMA_SERVICE_URL
              value: "http://chroma-db.workout-planner.svc.cluster.local:8000"
            - name: OLLAMA_SERVICE_URL
              value: "http://ollama.workout-planner.svc.cluster.local:11434"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: workout-planner
spec:
  selector:
    app: mcp-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
{{- end -}}