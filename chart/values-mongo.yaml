# Development environment values
global:
  environment: development

namespace:
  create: true
  name: workout-planner-dev

mongodb:
  auth:
    rootPassword: dev-password
  persistence:
    size: 5Gi
    storageClass: standard
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

backend:
  enabled: false

frontend:
  enabled: false

podDisruptionBudget:
  enabled: false
