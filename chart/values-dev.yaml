# Development environment values
global:
  environment: development

namespace:
  create: true
  name: workout-planner-dev

mongodb:
  auth:
    rootPassword: dev-password
  persistence:
    size: 5Gi
    storageClass: standard
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

backend:
  replicaCount: 1
  image:
    tag: dev
  autoscaling:
    enabled: false
  env:
    RUST_LOG: debug
    CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

frontend:
  replicaCount: 1
  service:
    type: NodePort
  autoscaling:
    enabled: false
  env:
    VITE_API_URL: "http://localhost:8080"

podDisruptionBudget:
  enabled: false
