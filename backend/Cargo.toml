[package]
name = "workout_planner_backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "workout_planner"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "2.4"
dotenv = "0.15"
env_logger = "0.10"
log = "0.4"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
cors = "0.4"

[dev-dependencies]
