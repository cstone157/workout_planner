apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workout-planner.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "workout-planner.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  environment: {{ .Values.global.environment | quote }}
