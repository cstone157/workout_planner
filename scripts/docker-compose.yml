version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: workout_planner_db
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout_password
      POSTGRES_DB: workout_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
