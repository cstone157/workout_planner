{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svelte-frontend
  namespace: workout-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svelte-frontend
  template:
    metadata:
      labels:
        app: svelte-frontend
    spec:
      containers:
        - name: svelte-frontend
          image: project/svelte-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: svelte-frontend
  namespace: workout-planner
spec:
  selector:
    app: svelte-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
{{- end -}}