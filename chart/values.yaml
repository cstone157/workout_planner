# Global configuration
global:
  environment: production

# Namespace configuration
namespace:
  create: true
  name: workout-planner

# MongoDB Configuration
mongodb:
  enabled: true
  auth:
    enabled: true
    rootUser: admin
    rootPassword: admin123  # CHANGE THIS IN PRODUCTION
    database: workout_planner
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard  # Change based on your cluster
  replicas: 1  # Change to 3+ for production
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Backend Configuration
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: workout-planner-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  env:
    RUST_LOG: info
    SERVER_HOST: "0.0.0.0"
    SERVER_PORT: 8080
    JWT_EXPIRATION_HOURS: 24
    CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://example.com"
  
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: workout-planner-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
  
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  env:
    VITE_API_URL: "http://api.example.com"

# Secrets
secrets:
  jwtSecret: "your-secret-key-change-this-in-production"
  mongodbRoot:
    username: admin
    password: admin123  # CHANGE THIS IN PRODUCTION

# Network Policy
networkPolicy:
  enabled: false

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
