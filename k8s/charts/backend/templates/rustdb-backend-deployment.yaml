{{- if .Values.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdb-backend
  namespace: workout-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rustdb-backend
  template:
    metadata:
      labels:
        app: rustdb-backend
    spec:
      containers:
        - name: rustdb-backend
          image: project/rustdb-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: MCP_SERVICE_URL
              value: "http://mcp-service.workout-planner.svc.cluster.local:8081"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rustdb-backend
  namespace: workout-planner
spec:
  selector:
    app: rustdb-backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
{{- end -}}