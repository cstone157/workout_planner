{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workout-planner.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "workout-planner.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "workout-planner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "workout-planner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        component: backend
    spec:
      serviceAccountName: {{ include "workout-planner.fullname" . }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.targetPort }}
          name: http
        env:
        - name: RUST_LOG
          value: {{ .Values.backend.env.RUST_LOG }}
        - name: SERVER_HOST
          value: {{ .Values.backend.env.SERVER_HOST }}
        - name: SERVER_PORT
          value: {{ .Values.backend.env.SERVER_PORT | quote }}
        - name: MONGODB_URI
          value: "mongodb://{{ .Values.secrets.mongodbRoot.username }}:{{ .Values.secrets.mongodbRoot.password }}@{{ include "workout-planner.fullname" . }}-mongodb:27017"
        - name: MONGODB_DATABASE
          value: {{ .Values.mongodb.auth.database }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "workout-planner.fullname" . }}-secrets
              key: jwt-secret
        - name: JWT_EXPIRATION_HOURS
          value: {{ .Values.backend.env.JWT_EXPIRATION_HOURS | quote }}
        - name: CORS_ALLOWED_ORIGINS
          value: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS }}
        resources:
          requests:
            memory: {{ .Values.backend.resources.requests.memory }}
            cpu: {{ .Values.backend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.backend.resources.limits.memory }}
            cpu: {{ .Values.backend.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.livenessProbe.httpGet.path }}
            port: {{ .Values.backend.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.readinessProbe.httpGet.path }}
            port: {{ .Values.backend.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
{{- end }}